<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: needed for real env(safe-area-inset-*) values and
         for the map to render under the status bar / Dynamic Island. In
         installed mode iOS then MISREPORTS every dynamic viewport height
         (innerHeight/100dvh/100svh say screen-minus-inset; the real window is
         full-screen — WebKit bug #254868), so style.css forces 100vh on
         html/body/#app there. Full write-up:
         dev-material/ios-safe-area-viewport.md. -->
    <!-- maximum-scale=1 suppresses iOS's auto-zoom when a sub-16px input gains
         focus (the rc editor textarea, landscape login fields); like
         user-scalable=no it does not block real pinch gestures on iOS 10+. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1c1917" />
    <title>PocketZot — Play DCSS on iOS &amp; Android (Dungeon Crawl Stone Soup)</title>
    <meta
      name="description"
      content="Play DCSS (Dungeon Crawl Stone Soup) on your phone. PocketZot is an unofficial mobile WebTiles client for iOS and Android — no App Store app needed, it installs from the browser as a PWA on your iPhone or Android device, with touch controls and an ASCII-first interface built for portrait mode."
    />
    <!-- Canonical / social URLs point at the project's official deployment.
         Forks deployed elsewhere should update the domain below. -->
    <link rel="canonical" href="https://pocketzot.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PocketZot" />
    <meta property="og:title" content="PocketZot — play Dungeon Crawl Stone Soup on your phone" />
    <meta
      property="og:description"
      content="Unofficial mobile DCSS WebTiles client for iOS &amp; Android. ASCII-first, touch controls, installs as a PWA."
    />
    <meta property="og:url" content="https://pocketzot.app/" />
    <meta property="og:image" content="https://pocketzot.app/social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The PocketZot icon: an ASCII dungeon scene with an @ beside a pool" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PocketZot — play Dungeon Crawl Stone Soup on your phone" />
    <meta
      name="twitter:description"
      content="Unofficial mobile DCSS WebTiles client for iOS &amp; Android. ASCII-first, touch controls, installs as a PWA."
    />
    <meta name="twitter:image" content="https://pocketzot.app/social-card.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "PocketZot",
        "url": "https://pocketzot.app/",
        "description": "Unofficial mobile WebTiles client for Dungeon Crawl Stone Soup (DCSS). Play DCSS on iPhone or Android in the browser; installs as a PWA.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "iOS, Android, any modern browser",
        "browserRequirements": "Requires JavaScript and WebSocket support",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "screenshot": "https://pocketzot.app/shot-spriggan.png",
        "sameAs": ["https://github.com/pocketzot/pocketzot"]
      }
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <main style="max-width:680px;margin:0 auto;padding:3rem 1.5rem;font-family:system-ui,-apple-system,sans-serif;color:#e7e2da;background:#0a0908;line-height:1.6">
        <h1>PocketZot — Dungeon Crawl Stone Soup in your pocket, on iOS and Android</h1>
        <p>
          PocketZot is an unofficial, mobile-first WebTiles client for
          <a href="https://crawl.develz.org" style="color:#d08a3e">Dungeon Crawl Stone Soup (DCSS)</a>.
          It connects to standard DCSS WebTiles servers with an ASCII-first,
          touch-friendly interface. There is no DCSS app on the iOS App
          Store. PocketZot lets you play DCSS on an iPhone or Android
          phone: it runs in the browser (Safari on iOS, Chrome on Android)
          and installs to your home screen as a Progressive Web App.
          JavaScript is required to play.
        </p>
        <p><a href="/about" style="color:#d08a3e">Read more about PocketZot →</a></p>
      </main>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
